# Used by parser_test/run_parsers.py to score each parser's output. See reports/parser_test.md
# for the exact matching/scoring rules (missing / wrong / garbled).
#
# 2026-09-10 (v4.1, real PDF): resume/v4_1_real.pdf (then named resume/v4_1.pdf) became the
# REAL résumé PDF (Google Docs export, the file Zoeb actually uploads to ATSs), replacing an
# earlier text-only reconstruction. In that file, the header's LinkedIn/Portfolio/GitHub
# profile links were hyperlink ANNOTATIONS on the bare words "LinkedIn"/"Portfolio"/"GitHub" —
# no URL characters anywhere in the visible text layer, so every text-extraction tool
# (pdftotext, PyMuPDF .get_text(), pdfminer.six) came up MISSING on all three link fields, and
# the evidence-links ablation (scripts/make_variants.py) was a no-op — there was no visible
# URL text to strip. See reports/parser_test_v4_1_real.md for that run.
#
# 2026-09-10 (v4.2): Zoeb printed the URLs as visible plain text in the header's right column
# — "linkedin.com/in/zoebnomi · zoebnomi.com · github.com/zoeb-nomi" — replacing the bare
# "LinkedIn · Portfolio · GitHub" labels. (The hyperlink annotations are still present underneath,
# per PyMuPDF page.get_links(), but that's no longer the only way to recover the URLs.) The three
# link fields below are updated to the bare-domain form that is now actually printed — no
# "https://" scheme, no "www." — because that is what a parser reading visible text can find;
# the underlying real URLs (https://www.linkedin.com/in/zoebnomi, https://zoebnomi.com,
# https://github.com/zoeb-nomi) are unchanged, only how they're rendered in the PDF changed.
# No other canon field value changed — the résumé body (summary, experience, education, skills)
# is byte-identical between v4.1 and v4.2 except for that one header line. See reports/parser_test.md
# for the v4.2 scores and a before/after table vs. v4.1.

